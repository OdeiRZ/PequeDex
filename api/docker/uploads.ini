; PHP's own hardcoded defaults (used whenever no php.ini is present, which
; is the case for the plain php:8.3-cli-alpine base image) are
; upload_max_filesize=2M and post_max_size=8M - both smaller than what
; this app already tells users it accepts (milestone photos up to 8MB,
; UpdateMilestoneRequest's own 'max:8192' rule). A real phone photo
; routinely exceeds 2M, so PHP silently drops the whole request before
; Laravel's validation ever runs - the app looks like it "hangs" with no
; error, when what's actually happening is the server never received a
; usable request in the first place. Found live on a real phone; never
; reproduced locally because XAMPP's own php.ini already allows 40M.
;
; post_max_size covers the *entire* multipart body (file + other fields +
; boundaries), so it's set a bit above upload_max_filesize, not equal to it.
upload_max_filesize = 10M
post_max_size = 12M
