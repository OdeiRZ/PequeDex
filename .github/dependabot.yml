# Actualizaciones automáticas de dependencias (una PR por grupo, cada lunes).
# Las de seguridad llegan aparte y al momento, esté o no esto activado en
# Settings > Code security. La CI de cada PR (backend, front, e2e) dice si
# la actualización rompe algo antes de fusionarla.
#
# Solo versiones menores y parches: los saltos mayores (TypeScript 7, vitest 5,
# laravel/tinker 3...) piden una migración propia y al activar Dependabot por
# primera vez abrieron una avalancha de PR que fallaban. Se hacen a mano,
# cuando toque. Las alertas de seguridad no se ven afectadas por esto.
version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
