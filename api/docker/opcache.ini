; Sin esto, PHP (modo CLI, que es el que usa `artisan serve`) vuelve a leer y
; compilar cada fichero de Laravel y de vendor/ en CADA petición. Medido en
; local con los mismos datos: 220 ms -> 40 ms por petición solo con opcache,
; y 31 ms con las cachés de configuración y rutas (docker/entrypoint.sh). En
; el contenedor gratuito de Render, con una fracción de CPU, esa compilación
; era buena parte del ~1 s fijo que costaba cada petición.
;
; validate_timestamps=0: dentro de la imagen los ficheros nunca cambian, así
; que no hace falta comprobarlo en cada petición.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
