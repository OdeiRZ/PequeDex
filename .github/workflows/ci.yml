name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pages: write/id-token: write son los permisos mínimos que exige
# actions/deploy-pages - sin esto el job deploy-pages falla al autenticarse.
# concurrency evita que dos deploys de Pages se pisen si hay dos pushes
# seguidos a main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Producción es PostgreSQL (Neon) pero los tests de `backend` corren en
  # SQLite en memoria: SQL propio (p.ej. la huella UNION ALL de
  # BabyActivityVersion) o diferencias de tipos entre las dos bases solo se
  # verían en producción. Este trabajo pasa toda la suite contra un
  # PostgreSQL real. Informativo de momento (no bloquea el despliegue).
  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pequedex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, mbstring, bcmath, ctype, fileinfo, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml fija SQLite, pero no pisa las variables de entorno que ya
      # existan: estas mandan.
      - name: Tests (Pest) against PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pequedex_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/pest

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: sqlite3, mbstring, bcmath, ctype, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Tests (Pest)
        run: vendor/bin/pest

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Format check (Prettier)
        run: npx prettier --check src/

      - name: Tests (Vitest)
        run: npx vitest run

      - name: Type-check and build
        # VITE_API_URL solo hace falta al construir (Vite la incrusta en el
        # bundle en build time, no se lee en runtime) - antes vivía como
        # variable de build de Cloudflare Pages, ahora aquí. Sin ella el
        # build cae al default de api.ts (localhost:8000), rompiendo la app
        # en producción contra la API real en Render.
        #
        # VITE_SENTRY_DSN (variable del repositorio, no secreto: el DSN es
        # público por diseño) activa el reporte de errores del frontend; si no
        # está definida queda vacía y no se reporta nada. VITE_APP_RELEASE
        # agrupa los errores por despliegue.
        env:
          VITE_API_URL: https://pequedex-0phw.onrender.com/api
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  # Prueba de humo de principio a fin: el build de la app contra el API
  # real con una SQLite desechable, en un Chrome de verdad (ver
  # web/playwright.config.ts). Informativo de momento: NO bloquea el despliegue
  # (no está en `needs` de deploy/deploy-pages) hasta que demuestre ser estable.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: sqlite3, mbstring, bcmath, ctype, fileinfo, gd, exif
          coverage: none

      - name: Install API dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare API environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Usa el Chrome que ya traen los runners de GitHub (channel: 'chrome'),
      # sin descargar un navegador aparte.
      - name: Run the end-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Upload traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  attribution-guard:
    name: Attribution Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 50

      - name: Check commit messages for disallowed AI attribution
        run: |
          C1="cla"; C2="ude"; CL="$C1$C2"
          A1="anthr"; A2="opic"; AN="$A1$A2"
          PATTERN="co-authored-by:.*$CL|$CL-session:|noreply@$AN\.com|@$AN\.com|generated with .?$CL|$CL\.ai/code"
          if git log -50 --format=%B | grep -qiE "$PATTERN"; then
            echo "::error::A recent commit message contains a disallowed AI attribution pattern - never allowed in this repo."
            git log -50 --oneline | head -5
            exit 1
          fi
          echo "Clean - no disallowed attribution pattern found in the last 50 commits."

  deploy:
    name: Trigger Render deploy
    needs: [backend, frontend, attribution-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    needs: [backend, frontend, attribution-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
