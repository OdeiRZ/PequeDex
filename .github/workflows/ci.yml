name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pages: write/id-token: write son los permisos mínimos que exige
# actions/deploy-pages - sin esto el job deploy-pages falla al autenticarse.
# concurrency evita que dos deploys de Pages se pisen si hay dos pushes
# seguidos a main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, mbstring, bcmath, ctype, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Tests (Pest)
        run: vendor/bin/pest

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Format check (Prettier)
        run: npx prettier --check src/

      - name: Tests (Vitest)
        run: npx vitest run

      - name: Type-check and build
        # VITE_API_URL solo hace falta al construir (Vite la incrusta en el
        # bundle en build time, no se lee en runtime) - antes vivía como
        # variable de build de Cloudflare Pages, ahora aquí. Sin ella el
        # build cae al default de api.ts (localhost:8000), rompiendo la app
        # en producción contra la API real en Render.
        env:
          VITE_API_URL: https://pequedex-0phw.onrender.com/api
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  attribution-guard:
    name: Attribution Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Check commit messages for disallowed AI attribution
        run: |
          C1="cla"; C2="ude"; CL="$C1$C2"
          A1="anthr"; A2="opic"; AN="$A1$A2"
          PATTERN="co-authored-by:.*$CL|$CL-session:|noreply@$AN\.com|@$AN\.com|generated with .?$CL|$CL\.ai/code"
          if git log -50 --format=%B | grep -qiE "$PATTERN"; then
            echo "::error::A recent commit message contains a disallowed AI attribution pattern - never allowed in this repo."
            git log -50 --oneline | head -5
            exit 1
          fi
          echo "Clean - no disallowed attribution pattern found in the last 50 commits."

  deploy:
    name: Trigger Render deploy
    needs: [backend, frontend, attribution-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    needs: [backend, frontend, attribution-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
