<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color-override is the first matching tag when it has content
    (set by theme.ts to mirror an explicit light/dark choice - a meta tag
    with no media attribute always matches, so it wins over the two below
    regardless of document order in most engines, but keeping it first
    keeps the intent readable). Left empty at parse time, which browsers
    treat as invalid and skip, falling through to whichever of the two
    prefers-color-scheme tags matches - same "system default unless
    overridden" behavior as data-theme in base.css. -->
    <meta name="theme-color" id="theme-color-override" content="" />
    <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b22" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Diario y seguimiento de bebé compartido entre cuidadores: tomas, sueño, pañales, hitos y crecimiento."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PequeDex" />
    <title>PequeDex</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Restaura la ruta real que 404.html codificó en la query string
      // antes de que vue-router arranque (ver public/404.html) - sin esto,
      // recargar o compartir un enlace a cualquier ruta que no sea la raíz
      // se quedaría en index.html con la URL del redirect en vez de la
      // ruta pedida.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
